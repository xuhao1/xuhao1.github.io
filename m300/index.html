<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>M300 · 轨道清道夫 — ORBITAL SWEEPER</title>
  <meta name="description" content="基于空间机器人研究项目背景制作的本地 Three.js 科幻街机演示：在 600 km 低轨回收碎片、检修节点、经营一家空间服务公司。" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2303060c'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%236ce8ff' stroke-width='2'/%3E%3Ccircle cx='22' cy='10' r='2' fill='%23ffb454'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <canvas id="scene-canvas"></canvas>

    <!-- HUD 由 js/hud.js 生成 -->
    <div id="hud-root"></div>

    <!-- 全屏界面（标题 / 简报 / 商店 / 结局）由 js/hud.js 生成 -->
    <div id="screens-root"></div>

    <div id="loading">
      <div class="loading-inner">
        <div class="loading-logo">M300<span>/01</span></div>
        <div class="loading-title">轨道清道夫</div>
        <div class="loading-sub">ORBITAL SWEEPER</div>
        <div class="loading-bar"><div class="loading-bar-fill"></div></div>
        <div class="loading-status" id="loading-status">正在烘焙程序化地球纹理…</div>
        <div class="loading-hint">鼠标 + 键盘操作 · 建议使用 Chrome / Edge / Safari 现代浏览器</div>
      </div>
    </div>

    <noscript>
      <div class="noscript">本演示需要启用 JavaScript 与 WebGL。</div>
    </noscript>
  </div>

  <!-- 单文件构建：从 file:// 双击打开也能运行（经典脚本不受 ES Module CORS 限制）。
       开发时修改 js/ 源码后需重新生成：demo_game/build_bundle.sh -->
  <script src="js/game.bundle.js"></script>
</body>
</html>
