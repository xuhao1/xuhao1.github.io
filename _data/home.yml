news:
  - date: "2026.10"
    tag: Paper
    text: >-
      New preprint <a href="https://arxiv.org/abs/2610.22736"><strong>Spatial Memory by Agents, for Agents</strong></a>:
      coding agents design a robot's spatial memory by writing code, running benchmarks, and iterating on feedback,
      which we call Guided System Improvement (GSI). The best configuration improves the average unified score by about
      51% over the strongest all-task baseline. With Mondo Robotics.
      <a href="https://ba-fa-3344.github.io/">Project page</a>
  - date: "2026.09"
    tag: Award
    text: >-
      <a href="https://fegkkd.github.io/IROS2026AUG/"><strong>AUG</strong></a> received an <strong>Honorable Mention
      for the IROS 2026 Best Paper Award on Safety, Security, and Rescue Robotics</strong>.
  - date: "2026.09"
    tag: Paper
    text: >-
      <a href="https://echo-g-project.github.io/"><strong>ECHO-G</strong></a> is out: humanoids that gesture on the beat
      while they talk, with end-to-end whole-body control running on a Jetson Orin AGX. With Mondo Robotics and the HKUST
      Aerial Robotics Group.
      <a href="https://arxiv.org/abs/2609.39575">arXiv</a> · <a href="https://github.com/NJU-SOARLAB/ECHO-G">Code</a> ·
      <a href="https://www.bilibili.com/video/BV1dJHi6DELp/">Video</a>
  - date: "2026.04"
    tag: Lab
    text: >-
      Started <a href="https://www.soar-lab.org/"><strong>SOARLAB</strong></a>, the Flying General Intelligence Lab, at
      Nanjing University. We are recruiting Ph.D. and master's students for 2027:
      <a href="https://www.soar-lab.org/recruiting/">admissions</a>.

